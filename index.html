

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KZETRAL — EH-X</title>

    <meta name="description" content="Découvrez KZETRAL EH-X, notre projet de berline européenne 100 % électrique à batterie sodium-ion.">

    <!-- POLICE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================
           BASE
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #08090b;
            --text: #ffffff;
            --secondary: #a5a8ad;
            --border: rgba(255,255,255,0.18);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .brand {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .navigation {
            display: flex;
            align-items: center;
            gap: 42px;
        }

        .navigation a {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #d3d4d7;
            transition: color .25s ease;
        }

        .navigation a:hover {
            color: #ffffff;
        }

        /* MENU MOBILE */

        .menu-button {
            display: none;
            background: transparent;
            border: 1px solid var(--border);
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* =========================
           PAGE D'ACCUEIL
        ========================= */

        .hero {
            position: relative;
            min-height: 100svh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 130px 7% 80px;
            text-align: center;
            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(55,65,82,0.20) 0%,
                    rgba(8,9,11,0.05) 48%,
                    rgba(8,9,11,1) 100%
                ),
                #08090b;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 650px;
            height: 650px;
            border: 1px solid rgba(255,255,255,0.025);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            width: 100%;
            margin: auto;
            animation: appear 1s ease forwards;
        }

        /* =========================
           TITRE EH-X
        ========================= */

        .hero h1 {
            font-size: clamp(100px, 17vw, 225px);
            font-weight: 600;
            line-height: 0.95;
            letter-spacing: -0.105em;
            margin-bottom: 34px;

            background: linear-gradient(
                180deg,
                #ffffff 15%,
                #c8cbd0 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* =========================
           DESCRIPTION
        ========================= */

        .hero-description {
            max-width: 760px;
            margin: 0 auto;
            color: #c5c8cd;
            font-size: clamp(15px, 1.5vw, 19px);
            font-weight: 400;
            line-height: 1.7;
            letter-spacing: 0.1px;
        }

        .hero-description strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* =========================
           BOUTONS
        ========================= */

        .hero-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 43px;
            flex-wrap: wrap;
        }

        .button {
            min-width: 205px;
            padding: 16px 25px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.1px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition:
                background .25s ease,
                color .25s ease,
                border-color .25s ease,
                transform .25s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-primary {
            background: #ffffff;
            color: #090a0c;
            border: 1px solid #ffffff;
        }

        .button-primary:hover {
            background: #dfe1e5;
            border-color: #dfe1e5;
        }

        .button-secondary {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.35);
        }

        .button-secondary:hover {
            background: rgba(255,255,255,0.10);
            border-color: #ffffff;
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           RESPONSIVE MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                height: 80px;
                padding: 0 6%;
            }

            .brand {
                font-size: 19px;
                letter-spacing: 3px;
            }

            .menu-button {
                display: block;
            }

            .navigation {
                display: none;
                position: absolute;
                top: 80px;
                left: 0;
                width: 100%;
                padding: 28px 6%;
                background: rgba(8,9,11,0.98);
                border-bottom: 1px solid var(--border);
                flex-direction: column;
                align-items: flex-start;
                gap: 25px;
            }

            .navigation.open {
                display: flex;
            }

            .navigation a {
                font-size: 14px;
            }

            .hero {
                padding: 100px 6% 60px;
            }

            .hero h1 {
                font-size: 23vw;
                letter-spacing: -0.10em;
                margin-bottom: 28px;
            }

            .hero-description {
                font-size: 14px;
                max-width: 440px;
            }

            .hero-buttons {
                flex-direction: column;
                gap: 12px;
                margin-top: 32px;
            }

            .button {
                width: 100%;
                max-width: 290px;
                padding: 15px 20px;
            }

            .hero::before {
                width: 380px;
                height: 380px;
            }
        }

        /* ACCESSIBILITÉ */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <a href="index.html" class="brand">
            KZETRAL
        </a>

        <nav class="navigation" id="navigation">

            <a href="entreprise.html">
                Qui nous sommes
            </a>

            <a href="vision.html">
                Notre vision
            </a>

        </nav>

        <button
            class="menu-button"
            id="menuButton"
            aria-expanded="false"
            aria-controls="navigation"
            aria-label="Ouvrir le menu">

            MENU

        </button>

    </header>


    <!-- PAGE D'ACCUEIL -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <h1>EH-X</h1>

                <p class="hero-description">
                    Notre ambition : développer
                    <strong>le premier véhicule européen 100 % électrique</strong>
                    utilisant une batterie en sodium-ion.
                </p>

                <div class="hero-buttons">

                    <a
                        href="eh-x.html"
                        class="button button-primary">

                        Découvrir le EH-X

                    </a>

                    <a
                        href="contact.html"
                        class="button button-secondary">

                        Contactez-nous

                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- MENU MOBILE -->

    <script>

        const menuButton = document.getElementById("menuButton");
        const navigation = document.getElementById("navigation");

        menuButton.addEventListener("click", function () {

            const isOpen = navigation.classList.toggle("open");

            menuButton.setAttribute("aria-expanded", isOpen);

            menuButton.textContent = isOpen ? "FERMER" : "MENU";

        });

        navigation.querySelectorAll("a").forEach(link => {

            link.addEventListener("click", function () {

                navigation.classList.remove("open");

                menuButton.setAttribute("aria-expanded", "false");

                menuButton.textContent = "MENU";

            });

        });

    </script>

</body>
</html>
