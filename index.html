
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KZETRAL — EH-X</title>

    <meta name="description"
          content="Découvrez KZETRAL EH-X, notre ambition de développer un véhicule européen 100 % électrique à batterie sodium-ion.">

    <!-- TYPOGRAPHIE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

    /* =====================================
       01 — VARIABLES
    ===================================== */

    :root {
        --ink: #101722;
        --muted: #697586;
        --white: #ffffff;
        --blue: #8ebce9;
        --dark-glass: rgba(12, 19, 31, .76);
        --light-glass: rgba(255, 255, 255, .43);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Sora', sans-serif;
        background: #f7f9fc;
        color: var(--ink);
        overflow-x: hidden;
    }

    a {
        text-decoration: none;
        color: inherit;
    }

    button {
        font-family: inherit;
    }

    /* =====================================
       02 — BARRE DE NAVIGATION EN VERRE
    ===================================== */

    .site-header {
        position: fixed;
        z-index: 1000;

        top: 18px;
        left: 50%;
        transform: translateX(-50%);

        width: min(1380px, calc(100% - 64px));
        height: 76px;

        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;

        padding: 0 34px;

        border-radius: 18px;
        border: 1px solid rgba(255,255,255,.72);

        background: rgba(255,255,255,.42);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);

        box-shadow: 0 8px 35px rgba(27,42,64,.045);

        transition:
            background .45s ease,
            border-color .45s ease,
            box-shadow .45s ease,
            height .45s ease,
            top .45s ease;
    }

    /* Menu gauche */

    .nav-left,
    .nav-right {
        display: flex;
        align-items: center;
        gap: 35px;
    }

    .nav-right {
        justify-content: flex-end;
    }

    .nav-link {
        position: relative;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: .1px;
        color: #202b3a;

        transition: color .35s ease;
    }

    .nav-link::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -7px;

        width: 0;
        height: 1px;
        background: currentColor;

        transition: width .3s ease;
    }

    .nav-link:hover::after {
        width: 100%;
    }

    /* LOGO CENTRÉ */

    .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 180px;
        height: 60px;
    }

    .brand img {
        display: block;
        width: 138px;
        max-height: 44px;
        object-fit: contain;

        filter: brightness(0);
        transition: filter .45s ease, transform .4s ease;
    }

    .brand:hover img {
        transform: scale(1.035);
    }

    /* NAVIGATION AU DÉFILEMENT */

    .site-header.is-scrolled {
        top: 12px;
        height: 68px;

        background: rgba(12, 19, 31, .78);
        border-color: rgba(255,255,255,.12);

        box-shadow: 0 12px 40px rgba(5,12,25,.16);
    }

    .site-header.is-scrolled .nav-link {
        color: #ffffff;
    }

    .site-header.is-scrolled .brand img {
        filter: brightness(0) invert(1);
    }

    .menu-button {
        display: none;
        color: #172234;
        background: rgba(255,255,255,.48);
        border: 1px solid rgba(255,255,255,.8);
        border-radius: 9px;
        padding: 10px 15px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1px;
        cursor: pointer;
        backdrop-filter: blur(15px);
    }

    .site-header.is-scrolled .menu-button {
        color: white;
        background: rgba(255,255,255,.10);
        border-color: rgba(255,255,255,.23);
    }

    /* =====================================
       03 — HERO / ACCUEIL
    ===================================== */

    .hero {
        position: relative;
        isolation: isolate;

        min-height: 100svh;
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 145px 7% 100px;

        overflow: hidden;

        background:
            radial-gradient(
                ellipse at 50% 43%,
                rgba(211,232,255,.9) 0%,
                rgba(234,243,253,.65) 31%,
                rgba(247,249,252,.2) 65%,
                transparent 80%
            ),
            linear-gradient(
                135deg,
                #ffffff 0%,
                #f1f5fa 50%,
                #ffffff 100%
            );
    }

    /* Halo animé */

    .hero-glow {
        position: absolute;
        z-index: -1;

        width: min(850px, 85vw);
        height: min(850px, 85vw);

        left: 50%;
        top: 45%;

        transform: translate(-50%, -50%);

        border-radius: 50%;

        background: radial-gradient(
            circle,
            rgba(164,204,245,.26) 0%,
            rgba(199,222,249,.13) 42%,
            transparent 70%
        );

        filter: blur(25px);

        animation: glowMove 9s ease-in-out infinite alternate;
    }

    @keyframes glowMove {
        from {
            transform: translate(-50%, -50%) scale(.90);
            opacity: .7;
        }

        to {
            transform: translate(-50%, -50%) scale(1.12);
            opacity: 1;
        }
    }

    /* Décorations orbitales */

    .orbit {
        position: absolute;
        z-index: -1;

        left: 50%;
        top: 45%;

        width: 690px;
        height: 690px;

        transform: translate(-50%, -50%);
        border: 1px solid rgba(91,137,190,.075);
        border-radius: 50%;

        animation: orbitRotate 55s linear infinite;
    }

    .orbit::before {
        content: "";
        position: absolute;
        inset: 42px;
        border: 1px solid rgba(91,137,190,.07);
        border-radius: 50%;
    }

    .orbit::after {
        content: "";
        position: absolute;
        inset: 95px;
        border: 1px solid rgba(91,137,190,.055);
        border-radius: 50%;
    }

    @keyframes orbitRotate {
        to {
            transform: translate(-50%, -50%) rotate(360deg);
        }
    }

    /* Lumières flottantes */

    .light {
        position: absolute;
        z-index: -1;

        width: 7px;
        height: 7px;

        border-radius: 50%;
        background: #ffffff;

        box-shadow:
            0 0 15px rgba(125,175,230,.7),
            0 0 35px rgba(125,175,230,.35);

        animation: floatLight 6s ease-in-out infinite;
    }

    .light-one {
        left: 18%;
        top: 36%;
    }

    .light-two {
        right: 19%;
        top: 57%;
        animation-delay: 1.5s;
    }

    .light-three {
        left: 28%;
        bottom: 19%;
        animation-delay: 3s;
    }

    @keyframes floatLight {
        0%, 100% {
            transform: translateY(0);
            opacity: .4;
        }

        50% {
            transform: translateY(-18px);
            opacity: 1;
        }
    }

    /* =====================================
       04 — CONTENU CENTRAL
    ===================================== */

    .hero-content {
        position: relative;
        z-index: 2;

        width: 100%;
        max-width: 1050px;

        text-align: center;

        animation: heroAppear 1.1s cubic-bezier(.2,.7,.2,1) both;
    }

    @keyframes heroAppear {
        from {
            opacity: 0;
            transform: translateY(35px);
            filter: blur(7px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }
    }

    .eyebrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 11px;

        margin-bottom: 26px;

        color: #71839a;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 3.2px;
        text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
        content: "";
        width: 24px;
        height: 1px;
        background: linear-gradient(
            90deg,
            transparent,
            #9bb6d5
        );
    }

    .eyebrow::after {
        transform: rotate(180deg);
    }

    /* TITRE EH-X */

    .hero h1 {
        font-size: clamp(115px, 18vw, 230px);
        font-weight: 600;
        line-height: .92;

        letter-spacing: -.105em;

        padding-right: .1em;

        background: linear-gradient(
            180deg,
            #101c2c 10%,
            #526a86 56%,
            #9aabba 100%
        );

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        filter: drop-shadow(0 12px 24px rgba(67,100,143,.10));

        animation: titleReveal 1.3s .15s both;
    }

    @keyframes titleReveal {
        from {
            opacity: 0;
            letter-spacing: -.16em;
        }

        to {
            opacity: 1;
            letter-spacing: -.105em;
        }
    }

    /* SOULIGNEMENT */

    .title-line {
        width: 75px;
        height: 3px;
        margin: 34px auto 26px;

        border-radius: 10px;

        background: linear-gradient(
            90deg,
            #bad9fa,
            #547da8,
            #bad9fa
        );

        box-shadow: 0 0 18px rgba(111,161,215,.35);
    }

    /* DESCRIPTION */

    .hero-description {
        max-width: 750px;
        margin: 0 auto;

        color: #586779;

        font-size: clamp(14px, 1.5vw, 18px);
        font-weight: 400;
        line-height: 1.9;
        letter-spacing: -.2px;

        animation: heroAppear 1s .35s both;
    }

    .hero-description strong {
        color: #172438;
        font-weight: 600;
    }

    .project-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        margin-top: 22px;

        color: #8795a6;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;

        animation: heroAppear 1s .45s both;
    }

    .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #73a9e1;

        box-shadow: 0 0 12px rgba(88,153,224,.55);
    }

    /* =====================================
       05 — BOUTONS VERRE
    ===================================== */

    .hero-buttons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;

        margin-top: 42px;

        animation: heroAppear 1s .55s both;
    }

    .button {
        min-width: 205px;

        min-height: 52px;
        padding: 0 25px;

        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 12px;

        border-radius: 11px;

        font-size: 12px;
        font-weight: 600;
        letter-spacing: .1px;

        position: relative;
        overflow: hidden;

        transition:
            transform .35s ease,
            box-shadow .35s ease,
            background .35s ease,
            border-color .35s ease;
    }

    .button:hover {
        transform: translateY(-4px);
    }

    /* Bouton principal */

    .button-primary {
        color: #ffffff;

        background: linear-gradient(
            115deg,
            #17283e,
            #324e6d
        );

        border: 1px solid rgba(255,255,255,.45);

        box-shadow:
            0 12px 28px rgba(31,57,87,.17),
            inset 0 1px 0 rgba(255,255,255,.18);
    }

    .button-primary:hover {
        box-shadow:
            0 17px 38px rgba(31,57,87,.24),
            inset 0 1px 0 rgba(255,255,255,.23);
    }

    /* Reflet animé */

    .button-primary::before {
        content: "";
        position: absolute;

        top: -50%;
        left: -100%;

        width: 55%;
        height: 200%;

        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

        transform: rotate(25deg);
        transition: left .65s ease;
    }

    .button-primary:hover::before {
        left: 150%;
    }

    /* Bouton secondaire verre */

    .button-glass {
        color: #26384e;

        background: rgba(255,255,255,.52);
        border: 1px solid rgba(255,255,255,.9);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
            0 8px 25px rgba(41,65,91,.07),
            inset 0 1px 0 rgba(255,255,255,.9);
    }

    .button-glass:hover {
        background: rgba(255,255,255,.85);
        box-shadow: 0 14px 30px rgba(41,65,91,.12);
        border-color: #ffffff;
    }

    .button-arrow {
        font-size: 15px;
        transition: transform .3s ease;
    }

    .button:hover .button-arrow {
        transform: translateX(4px);
    }

    /* =====================================
       06 — PETIT INDICATEUR BAS DE PAGE
    ===================================== */

    .bottom-indicator {
        position: absolute;
        bottom: 28px;
        left: 50%;

        transform: translateX(-50%);

        display: flex;
        align-items: center;
        gap: 11px;

        color: #8b99a9;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;

        opacity: .8;
    }

    .indicator-line {
        width: 32px;
        height: 1px;
        background: linear-gradient(
            90deg,
            transparent,
            #91a9c5
        );

        animation: indicatorMove 2s ease-in-out infinite;
    }

    @keyframes indicatorMove {
        0%, 100% {
            transform: scaleX(.5);
            opacity: .4;
        }

        50% {
            transform: scaleX(1);
            opacity: 1;
        }
    }

    /* =====================================
       07 — RESPONSIVE
    ===================================== */

    @media (max-width: 760px) {

        .site-header {
            width: calc(100% - 28px);
            top: 12px;
            height: 66px;
            padding: 0 17px;
            grid-template-columns: 1fr auto 1fr;
            border-radius: 14px;
        }

        .site-header.is-scrolled {
            top: 8px;
            height: 62px;
        }

        .nav-left,
        .nav-right {
            display: none;
        }

        .brand {
            grid-column: 2;
            width: 140px;
        }

        .brand img {
            width: 116px;
            max-height: 38px;
        }

        .menu-button {
            display: block;
            grid-column: 3;
            justify-self: end;
        }

        .mobile-nav {
            position: absolute;
            top: calc(100% + 9px);
            left: 0;
            width: 100%;

            display: flex;
            flex-direction: column;
            gap: 0;

            border-radius: 15px;
            overflow: hidden;

            background: rgba(255,255,255,.83);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            border: 1px solid rgba(255,255,255,.9);

            box-shadow: 0 15px 35px rgba(20,39,62,.10);

            opacity: 0;
            visibility: hidden;
            transform: translateY(-9px);

            transition:
                opacity .3s ease,
                transform .3s ease,
                visibility .3s ease;
        }

        .mobile-nav.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .mobile-nav a {
            padding: 19px 22px;
            color: #172438;
            font-size: 12px;
            font-weight: 600;

            border-bottom: 1px solid rgba(30,50,75,.07);
        }

        .site-header.is-scrolled .mobile-nav {
            background: rgba(12,19,31,.93);
            border-color: rgba(255,255,255,.12);
        }

        .site-header.is-scrolled .mobile-nav a {
            color: white;
            border-color: rgba(255,255,255,.1);
        }

        .hero {
            padding: 125px 6% 90px;
            min-height: 100svh;
        }

        .hero h1 {
            font-size: 24vw;
        }

        .eyebrow {
            font-size: 8px;
            letter-spacing: 2px;
            margin-bottom: 23px;
        }

        .hero-description {
            font-size: 13px;
            line-height: 1.85;
        }

        .project-status {
            font-size: 8px;
            letter-spacing: 1.5px;
        }

        .hero-buttons {
            flex-direction: column;
            gap: 12px;
            margin-top: 32px;
        }

        .button {
            width: 100%;
            max-width: 310px;
            min-height: 50px;
        }

        .orbit {
            width: 420px;
            height: 420px;
        }

        .bottom-indicator {
            bottom: 17px;
            font-size: 8px;
        }
    }

    /* =====================================
       08 — ACCESSIBILITÉ
    ===================================== */

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: .01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: .01ms !important;
            scroll-behavior: auto !important;
        }
    }

    </style>
</head>

<body>

    <!-- =================================
         BARRE DE NAVIGATION
    ================================== -->

    <header class="site-header" id="siteHeader">

        <nav class="nav-left">
            <a href="entreprise.html" class="nav-link">
                Qui nous sommes
            </a>
        </nav>

        <!-- LOGO KZETRAL AU CENTRE -->

        <a href="index.html" class="brand" aria-label="Accueil KZETRAL">
            <img src="images/logo-kzetral.png" alt="KZETRAL">
        </a>

        <nav class="nav-right">
            <a href="vision.html" class="nav-link">
                Notre vision
            </a>
        </nav>

        <!-- MENU MOBILE -->

        <button
            class="menu-button"
            id="menuButton"
            aria-expanded="false"
            aria-controls="mobileNav">

            MENU

        </button>

        <nav class="mobile-nav" id="mobileNav">

            <a href="entreprise.html">
                Qui nous sommes
            </a>

            <a href="vision.html">
                Notre vision
            </a>

        </nav>

    </header>


    <!-- =================================
         PAGE D'ACCUEIL
    ================================== -->

    <main>

        <section class="hero">

            <!-- EFFETS VISUELS -->

            <div class="hero-glow"></div>
            <div class="orbit"></div>

            <div class="light light-one"></div>
            <div class="light light-two"></div>
            <div class="light light-three"></div>

            <!-- CONTENU -->

            <div class="hero-content">

                <div class="eyebrow">
                    KZETRAL · ELECTRIC MOBILITY
                </div>

                <h1>EH-X</h1>

                <div class="title-line"></div>

                <p class="hero-description">
                    Notre ambition : développer
                    <strong>le premier véhicule européen
                    100 % électrique</strong>
                    utilisant une batterie en sodium-ion.
                </p>

                <div class="project-status">
                    <span class="status-dot"></span>
                    Programme en développement
                </div>

                <!-- BOUTONS -->

                <div class="hero-buttons">

                    <a href="eh-x.html"
                       class="button button-primary">

                        Découvrir le EH-X

                        <span class="button-arrow">↗</span>

                    </a>

                    <a href="contact.html"
                       class="button button-glass">

                        Contactez-nous

                        <span class="button-arrow">↗</span>

                    </a>

                </div>

            </div>

            <!-- INDICATEUR -->

            <div class="bottom-indicator">
                <span class="indicator-line"></span>
                KZETRAL
                <span class="indicator-line"></span>
            </div>

        </section>

    </main>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>

        /* BARRE INTELLIGENTE AU DÉFILEMENT */

        const siteHeader = document.getElementById("siteHeader");

        function updateHeader() {
            if (window.scrollY > 35) {
                siteHeader.classList.add("is-scrolled");
            } else {
                siteHeader.classList.remove("is-scrolled");
            }
        }

        window.addEventListener("scroll", updateHeader, {
            passive: true
        });

        updateHeader();


        /* MENU MOBILE */

        const menuButton = document.getElementById("menuButton");
        const mobileNav = document.getElementById("mobileNav");

        menuButton.addEventListener("click", function () {

            const isOpen = mobileNav.classList.toggle("open");

            menuButton.setAttribute("aria-expanded", isOpen);

            menuButton.textContent = isOpen ? "FERMER" : "MENU";

        });


        /* FERMER LE MENU APRÈS NAVIGATION */

        mobileNav.querySelectorAll("a").forEach(link => {

            link.addEventListener("click", function () {

                mobileNav.classList.remove("open");

                menuButton.setAttribute("aria-expanded", "false");

                menuButton.textContent = "MENU";

            });

        });


        /* FERMER AVEC LA TOUCHE ÉCHAP */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {

                mobileNav.classList.remove("open");

                menuButton.setAttribute("aria-expanded", "false");

                menuButton.textContent = "MENU";

            }

        });

    </script>

</body>
</html>
