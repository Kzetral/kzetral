
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Kzetral — EH-X</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #101722;
      --muted: #697586;
      --white: #ffffff;
      --blue: #8ebce9;
      --line: #e8ebef;
      --soft: #f4f5f6;
      --glass: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(16, 23, 34, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Sora', sans-serif;
      color: var(--ink);
      background: var(--white);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVIGATION */

    .navbar {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: min(920px, calc(100% - 40px));
      height: 84px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 38px;
      width: 40%;
    }

    .nav-links.right {
      justify-content: flex-end;
    }

    .nav-links a {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      transition: opacity 0.25s ease;
    }

    .nav-links a:hover {
      opacity: 0.55;
    }

    .nav-logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-logo img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      transition: filter 0.3s ease;
    }

    .navbar.scrolled {
      background: rgba(16, 23, 34, 0.94);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .navbar.scrolled .nav-links a {
      color: #ffffff;
    }

    .navbar.scrolled .nav-logo img {
      filter: brightness(0) invert(1);
    }

    .mobile-menu-button {
      display: none;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .navbar.scrolled .mobile-menu-button {
      color: #ffffff;
    }

    .mobile-menu {
      display: none;
      position: absolute;
      top: 86px;
      left: 0;
      right: 0;
      padding: 18px;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 16px 40px rgba(16, 23, 34, 0.08);
    }

    .mobile-menu.open {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .mobile-menu a {
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
    }

    /* HERO */

    .hero {
      position: relative;
      min-height: 100vh;
      padding: 170px 24px 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--white);
    }

    .hero-content {
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
    }

    .hero h1 {
      margin-bottom: 26px;
      font-size: clamp(76px, 15vw, 172px);
      line-height: 0.95;
      letter-spacing: -0.095em;
      font-weight: 700;
      color: var(--ink);
    }

    .hero h1 span {
      display: block;
      color: #71849a;
    }

    .hero-description {
      max-width: 610px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.9;
    }

    .hero-description strong {
      color: var(--ink);
      font-weight: 600;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 38px;
    }

    .button {
      min-height: 54px;
      padding: 0 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      color: #ffffff;
      background: var(--ink);
      border: 1px solid var(--ink);
    }

    .button-primary:hover {
      background: #263446;
      border-color: #263446;
    }

    .button-secondary {
      color: var(--ink);
      background: #ffffff;
      border: 1px solid #dfe3e8;
    }

    .button-secondary:hover {
      background: var(--soft);
    }

    /* INDICATEUR */

    .hero-bottom {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 13px;
      color: #9aa3ad;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
    }

    .hero-bottom::before,
    .hero-bottom::after {
      content: "";
      width: 34px;
      height: 1px;
      background: #dfe3e8;
    }

    /* RESPONSIVE */

    @media (max-width: 700px) {
      .navbar {
        top: 14px;
        width: calc(100% - 28px);
        height: 66px;
        padding: 0 20px;
      }

      .navbar > .nav-links {
        display: none;
      }

      .mobile-menu-button {
        display: block;
      }

      .nav-logo img {
        width: 58px;
        height: 58px;
      }

      .hero {
        min-height: 100svh;
        padding: 150px 22px 110px;
      }

      .hero h1 {
        font-size: clamp(68px, 19vw, 112px);
        margin-bottom: 22px;
      }

      .hero-description {
        font-size: 13px;
        line-height: 1.8;
      }

      .hero-buttons {
        flex-direction: column;
        gap: 11px;
        margin-top: 30px;
      }

      .button {
        width: 100%;
        max-width: 310px;
      }

      .hero-bottom {
        bottom: 25px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar" id="navbar">
    <div class="nav-links">
      <a href="entreprise.html">Qui nous sommes</a>
    </div>

    <a href="index.html" class="nav-logo" aria-label="Kzetral - Accueil">
      <img src="images/logo-kzetral.png" alt="Logo Kzetral">
    </a>

    <div class="nav-links right">
      <a href="vision.html">Notre vision</a>
    </div>

    <button class="mobile-menu-button" id="menuButton" aria-expanded="false">
      MENU
    </button>

    <div class="mobile-menu" id="mobileMenu">
      <a href="entreprise.html">Qui nous sommes</a>
      <a href="vision.html">Notre vision</a>
    </div>
  </nav>

  <main>
    <section class="hero">
      <div class="hero-content">

        <h1>
          Kzetral
          <span>EH-X</span>
        </h1>

        <p class="hero-description">
          Le premier véhicule européen <strong>100 % électrique</strong>
          utilisant une batterie en sodium-ion.
        </p>

        <div class="hero-buttons">
          <a href="eh-x.html" class="button button-primary">
            Découvrir le EH-X
          </a>

          <a href="contact.html" class="button button-secondary">
            Contactez-nous
          </a>
        </div>

      </div>

      <div class="hero-bottom">
        Kzetral
      </div>
    </section>
  </main>

  <script>
    const navbar = document.getElementById("navbar");
    const menuButton = document.getElementById("menuButton");
    const mobileMenu = document.getElementById("mobileMenu");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 40) {
        navbar.classList.add("scrolled");
      } else {
        navbar.classList.remove("scrolled");
      }
    });

    menuButton.addEventListener("click", () => {
      const isOpen = mobileMenu.classList.toggle("open");
      menuButton.setAttribute("aria-expanded", isOpen);
    });

    mobileMenu.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        mobileMenu.classList.remove("open");
        menuButton.setAttribute("aria-expanded", "false");
      });
    });
  </script>

</body>
</html>
